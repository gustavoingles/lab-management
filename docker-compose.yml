services:
  postgres:
    image: postgres:17
    container_name: postgres-dev
    restart: unless-stopped
    environment:
       POSTGRES_USER: admin
       POSTGRES_PASSWORD: 123456
       POSTGRES_DB: banco-lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d banco-lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: lab-management-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: django-insecure-labmanager-dev-key-change-in-production
      DEBUG: "True"
      DATABASE_URL: postgres://admin:123456@postgres:5432/banco-lab
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: admin
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - static_files:/app/staticfiles

volumes:
  postgres_data:
  static_files: