Dados do material ou equipamento no catálogo. O campo <strong>tipo</strong> define o uso: reagentes/consumíveis vão para estoque; tipo <strong>Equipamento</strong> exige cadastro em <a href="{% url 'app:equipamentos' %}" class="text-primary hover:underline">Equipamentos</a>. Itens com movimentação ou requisição no histórico não podem ser excluídos — desmarque <strong>Ativo</strong> para ocultar do dia a dia.
